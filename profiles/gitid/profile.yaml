apiVersion: 1
profile:
  name: gitid
  type: business
  title: gitid — Git 多身份管理器
  # 双栈：CLI（node-cli）+ 桌面端（electron-vue3）；栈规范随栈分发，本 profile 只持业务知识/工作区/产品不变量
  depends: [node-cli, electron-vue3]
knowledge:
  inject: CLAUDE.md
  sections:
    business-concepts: knowledge/business-concepts/index.md
    design-decisions: knowledge/design-decisions/index.md
    service-pool: knowledge/service-pool/index.md
    architecture-choices: knowledge/architecture-choices/index.md
workspace:
  root: workspace
  index: workspace/INDEX.md
  stages:
    architecture: workspace/00-architecture
    prd: workspace/02-detailed/prd
    api: workspace/02-detailed/api
    interaction: workspace/02-detailed/interaction
    reports: workspace/05-reports
  # CLI 工具无业务枚举池/选择服务池，conventions 槽位以说明性占位文件满足契约
  conventions:
    enum_pool: workspace/01-solution/common-spec/enum-pool.md
    common_enums: workspace/01-solution/common-spec/common-enums.md
    select_pool: workspace/01-solution/common-spec/select-pool.md
slots:
  cli_entry: cli/bin/gitid.js
  node_engines: ">=18"
  config_path_default: ~/.config/gitid/config.json
# 产品级不变量（use 全量覆盖/凭据零接触/git 唯一事实源等）随业务层挂载
assets:
  rules: [rules/product-rules.md]
