# 发版流水线：推 v* tag 触发（git push github v0.x.y && git push origin v0.x.y）
# 测试 → 构建 linux x64/arm64 × AppImage/deb/rpm + win x64/arm64 NSIS
# → 创建 GitHub Release 附产物（gitee 侧只接收代码与 tag 推送，不做 Release 镜像）
# workflow_dispatch 手动触发只跑测试与构建（release 仅 tag 触发）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 xvfb（桌面端 Electron 全链路用例）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: CLI e2e（沙箱 HOME 隔离）
        run: npm test
        working-directory: cli
      - name: 桌面端测试（core 一致性 + 沙箱 + xvfb 集成）
        run: npm ci && npm run sync-core && npm test
        working-directory: desktop

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - name: 安装 rpm 打包链（electron-builder rpm 目标需 rpmbuild；fpm 由 app-builder 联网下载）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: 构建 AppImage/deb/rpm（x64 + arm64）
        run: npm run dist:linux
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - name: 构建 NSIS 安装包(x64 + arm64)
        run: npm run package:win
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          if-no-files-found: error
          path: desktop/dist/*.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 创建 GitHub Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          mkdir -p assets
          find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) -exec cp {} assets/ \;
          ls -lh assets/
          # 本任务无 checkout（无 git 上下文），gh 需显式 --repo
          gh release create "$TAG" --repo "$REPO" assets/* --title "gitid $TAG" --generate-notes \
            || gh release upload "$TAG" --repo "$REPO" assets/* --clobber
